[package]
name = "cadvisor-test"
version = "0.1.0"
edition = "2021"
description = "cadvisor's test container: short, medium and long suites against cadvisor on a running node."
license = "Apache-2.0"
publish = false

# Its own workspace, as stormlb's is: the golden's `cargo build --release
# --locked` at the repo root never sees it, and it has its own Cargo.lock.
[workspace]

[lib]
name = "cadvisor_test"
path = "src/lib.rs"

[[bin]]
name = "cadvisor-test"
path = "src/main.rs"

# cadvisor itself is never linked in: it is reached over HTTP on the node.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true
