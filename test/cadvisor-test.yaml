# cadvisor-test: how cadvisor's tests run on a test machine, per stormcentral
# docs/test-standard.md. stormcentral builds its own Job (src/testruns.rs):
# this file is the suites' metadata and a reference for running one by hand.
#
# Test metadata (what the runner matches against the machine):
#   suites:   short (< 2 min), medium (< 30 min), long (the night window)
#   image:    one image, test/Containerfile; started as `/test <suite>`
#   requires: []            (no hardware. medium's `accuracy` reports skip on
#                            a machine with one core — min-cores: 2 — and its
#                            `oom` reports skip if the runtime applies no pod
#                            memory limit.)
#   hostNetwork: false      (cadvisor is reached at STORM_NODE:9096 from the
#                            pod network; stormd at STORM_NODE:9196)
#   privileged: false
#   api:      namespaced only: pods (create, get, list, delete) in the run's
#             namespace; get on this Job's own pod (its image and node).
#             Nothing cluster-scoped. Waves are sized from cadvisor's
#             /api/v2.0/machine, not from nodes.
#   creates:  workload pods `w-<run>-<n>` in the run's namespace, labelled
#             storm.io/test-run=<run id> and cadvisor-test/workload=true,
#             running this image as `/test workload <marker> …`, pinned to
#             the Job's node. Deleted by every suite; the namespace's deletion
#             is the backstop.
#   targets:  cadvisor at STORM_NODE:9096, stormd at STORM_NODE:9196
#   external: none
#   results:  JSON lines on stdout and /results/results.jsonl; the long
#             suite's wave-N lines carry wave, pods, discover_ms, scrape_ms,
#             drain_ms, residue, cadvisor_rss, cadvisor_fds.
#
# By hand: create the namespace, the ServiceAccount and Role below, fill in
# NAMESPACE / RUN_ID / NODE / API / SUITE / TIMEOUT / TIMEOUT_PLUS_MARGIN /
# COMMIT / IMAGE, apply, read the Job's log, delete the namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storm-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storm-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storm-test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}" }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: storm-test }
subjects:
  - { kind: ServiceAccount, name: storm-test, namespace: "${NAMESPACE}" }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: test
  namespace: ${NAMESPACE}
  labels: { storm.io/test-run: "${RUN_ID}", storm.io/component: cadvisor, storm.io/suite: "${SUITE}" }
spec:
  backoffLimit: 0            # a retry would hide the finding
  activeDeadlineSeconds: ${TIMEOUT_PLUS_MARGIN}
  template:
    metadata:
      labels: { storm.io/test-run: "${RUN_ID}" }
    spec:
      restartPolicy: Never
      serviceAccountName: storm-test
      containers:
        - name: test
          image: ${IMAGE}
          command: ["/test"]
          args: ["${SUITE}"]
          env:
            - { name: STORM_API, value: "${API}" }
            - { name: STORM_NAMESPACE, value: "${NAMESPACE}" }
            - { name: STORM_RUN_ID, value: "${RUN_ID}" }
            - { name: STORM_NODE, value: "${NODE}" }
            - { name: STORM_SUITE, value: "${SUITE}" }
            - { name: STORM_TIMEOUT, value: "${TIMEOUT}" }
            - { name: STORM_COMPONENT, value: cadvisor }
            - { name: STORM_COMMIT, value: "${COMMIT}" }
          volumeMounts:
            - { name: results, mountPath: /results }
      volumes:
        - { name: results, emptyDir: {} }
